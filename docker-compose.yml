services:
  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:16
    volumes:
      - database-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    ports:
      - "${DB_PORT}:5432"

volumes:
  database-volume:
